server:
  port: ${AI_SERVER_PORT:8010}

spring:
  application:
    name: healing-planet-ai
  http:
    client:
      connect-timeout: ${AI_HTTP_CONNECT_TIMEOUT:10s}
      read-timeout: ${AI_HTTP_READ_TIMEOUT:60s}
    reactiveclient:
      connect-timeout: ${AI_HTTP_CONNECT_TIMEOUT:10s}
      read-timeout: ${AI_HTTP_REACTIVE_READ_TIMEOUT:60s}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${COMMUNITY_DB_URL:jdbc:mysql://localhost:3306/green_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${COMMUNITY_DB_USERNAME:root}
    password: ${COMMUNITY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      # 仅写入 rag_embedding_state；业务表仍由应用约束保持只读。
      read-only: false
  ai:
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:1}
    openai:
      api-key: ${LLM_API_KEY:change-me}
      base-url: ${LLM_BASE_URL:https://api.siliconflow.cn}
      chat:
        options:
          model: ${LLM_MODEL:Qwen/Qwen3.5-397B-A17B}
          temperature: ${LLM_TEMPERATURE:0.1}
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        api-key: ${EMBEDDING_API_KEY:not-required}
        options:
          model: ${EMBEDDING_MODEL:BAAI/bge-m3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

app:
  rag:
    # 消融组合：
    # BM25 Only = BM25_ONLY + reranker/source-aware-ranking/evidence-selector 均关闭
    # Dense Only = DENSE_ONLY + reranker/source-aware-ranking/evidence-selector 均关闭
    # Dense + BM25 + RRF = HYBRID_RRF + 上述三个后处理阶段均关闭
    # 完整方案 = HYBRID_RRF + 上述三个后处理阶段均开启
    retrieval-mode: ${RAG_RETRIEVAL_MODE:HYBRID_RRF} # BM25_ONLY | DENSE_ONLY | HYBRID_RRF
    dense-top-k: ${RAG_DENSE_TOP_K:30}
    sparse-top-k: ${RAG_SPARSE_TOP_K:30}
    final-top-k: ${RAG_FINAL_TOP_K:6}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.25}
    rrf-k: ${RAG_RRF_K:60}
    # 第一轮召回后仅在真实 coverage 缺口存在时，按来源从 30 → 60 → 120 有界扩展。
    adaptive-recall:
      enabled: ${RAG_ADAPTIVE_RECALL_ENABLED:true}
      max-dense-top-k: ${RAG_ADAPTIVE_RECALL_MAX_DENSE_TOP_K:120}
      max-sparse-top-k: ${RAG_ADAPTIVE_RECALL_MAX_SPARSE_TOP_K:120}
      min-unique-logical-candidates: ${RAG_ADAPTIVE_RECALL_MIN_UNIQUE_CANDIDATES:2}
    # 首轮 rerank 已有候选却全部偏弱时，才允许按缺口来源继续扩召回。
    # 该阈值只代表“值得停止继续召回”，显著低于 Answerability，且 reranker 无分数时不生效。
    recall-qualification:
      enabled: ${RAG_RECALL_QUALIFICATION_ENABLED:true}
      minimum-rerank-score: ${RAG_RECALL_QUALIFICATION_MIN_RERANK_SCORE:0.20}
    # 以下参数由 RAG 配置版本控制，并在每次 ChatClient 调用时覆盖默认 options。
    generation:
      model: ${LLM_MODEL:Qwen/Qwen3.5-397B-A17B}
      temperature: ${LLM_TEMPERATURE:0.1}
      max-tokens: ${LLM_MAX_TOKENS:1024}
      # 仅用于发布前连通性探测；不进入版本库。
      health-path: ${RAG_CHAT_HEALTH_PATH:/v1/models}
    # 多实例共享 rag_config_revision，以 ACTIVE revision 轮询收敛。
    config-sync-enabled: ${RAG_CONFIG_SYNC_ENABLED:true}
    config-sync-interval-ms: ${RAG_CONFIG_SYNC_INTERVAL_MS:5000}
    config-sync-initial-delay-ms: ${RAG_CONFIG_SYNC_INITIAL_DELAY_MS:10000}
    bm25:
      k1: ${RAG_BM25_K1:1.2}
      b: ${RAG_BM25_B:0.75}
      min-ngram: ${RAG_BM25_MIN_NGRAM:1}
      max-ngram: ${RAG_BM25_MAX_NGRAM:3}
    data-directory: ${RAG_DATA_DIRECTORY:data/rag}
    ingestion:
      # 外层业务批控制内存和单次 Qdrant 写入；取值必须在 50 到 200 之间。
      batch-size: ${RAG_INGESTION_BATCH_SIZE:100}
      # 模型、维度或归一化策略变化时必须改变此值，使已有 chunk 被重新向量化。
      embedding-model-version: ${RAG_EMBEDDING_MODEL_VERSION:${EMBEDDING_MODEL:BAAI/bge-m3}}
      # Spring AI TokenCountBatchingStrategy 的内层 token 批处理配置。
      embedding-batch-max-tokens: ${RAG_EMBEDDING_BATCH_MAX_TOKENS:8000}
      embedding-batch-reserve-percentage: ${RAG_EMBEDDING_BATCH_RESERVE_PERCENTAGE:0.1}
      # 文本分块使用统一的 TokenAwareTextChunker；不同来源可保留不同上下文预算。
      plant-general-care-max-tokens: ${RAG_PLANT_GENERAL_CARE_MAX_TOKENS:800}
      community-max-tokens: ${RAG_COMMUNITY_MAX_TOKENS:800}
      disease-max-tokens: ${RAG_DISEASE_MAX_TOKENS:800}
    internal-api-key: ${RAG_INTERNAL_API_KEY:}
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_GRPC_PORT:6334}
      tls: ${QDRANT_TLS:false}
      api-key: ${QDRANT_API_KEY:}
      plant-collection: ${QDRANT_PLANT_COLLECTION:plant_knowledge}
      plant-entity-collection: ${QDRANT_PLANT_ENTITY_COLLECTION:plant_entities}
      community-collection: ${QDRANT_COMMUNITY_COLLECTION:community_knowledge}
      disease-collection: ${QDRANT_DISEASE_COLLECTION:disease_knowledge}
      initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:true}
    entity-resolution:
      candidate-top-k: ${RAG_ENTITY_CANDIDATE_TOP_K:5}
      fuzzy-hard-threshold: ${RAG_ENTITY_FUZZY_HARD_THRESHOLD:0.90}
      fuzzy-soft-threshold: ${RAG_ENTITY_FUZZY_SOFT_THRESHOLD:0.65}
      fuzzy-hard-margin: ${RAG_ENTITY_FUZZY_HARD_MARGIN:0.15}
      fuzzy-soft-margin: ${RAG_ENTITY_FUZZY_SOFT_MARGIN:0.08}
      llm-enabled: ${RAG_ENTITY_LLM_ENABLED:true}
      llm-model: ${RAG_ENTITY_LLM_MODEL:Qwen/Qwen3.5-4B}
      llm-temperature: ${RAG_ENTITY_LLM_TEMPERATURE:0.0}
      llm-max-tokens: ${RAG_ENTITY_LLM_MAX_TOKENS:160}
      llm-enable-thinking: ${RAG_ENTITY_LLM_ENABLE_THINKING:false}
      llm-max-candidates: ${RAG_ENTITY_LLM_MAX_CANDIDATES:5}
      llm-confidence-threshold: ${RAG_ENTITY_LLM_CONFIDENCE_THRESHOLD:0.90}
      llm-cache-max-entries: ${RAG_ENTITY_LLM_CACHE_MAX_ENTRIES:256}
      llm-connect-timeout-millis: ${RAG_ENTITY_LLM_CONNECT_TIMEOUT_MILLIS:1000}
      llm-read-timeout-millis: ${RAG_ENTITY_LLM_READ_TIMEOUT_MILLIS:8000}
      circuit-breaker-failure-threshold: ${RAG_ENTITY_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-breaker-open-millis: ${RAG_ENTITY_CIRCUIT_OPEN_MILLIS:5000}
    reranker:
      enabled: ${RERANKER_ENABLED:true}
      base-url: ${RERANKER_BASE_URL:https://api.siliconflow.cn}
      path: ${RERANKER_PATH:/v1/rerank}
      api-key: ${RERANKER_API_KEY:}
      model: ${RERANKER_MODEL:BAAI/bge-reranker-v2-m3}
      # 先限制逻辑证据数，再限制每条逻辑证据的 fragment 数和总 fragment 数，避免长文占满重排输入。
      candidate-top-k: ${RERANKER_CANDIDATE_TOP_K:20} # 0 表示不限制逻辑证据数
      max-fragments-per-logical-evidence: ${RERANKER_MAX_FRAGMENTS_PER_LOGICAL_EVIDENCE:2}
      max-fragments-total: ${RERANKER_MAX_FRAGMENTS_TOTAL:40}
    # 可选备用连接。管理端版本仅保存 profile id，不会保存 base-url、api-key 等部署机密。
    # reranker-connections:
    #   standby:
    #     label: 备用重排服务
    #     base-url: ${RERANKER_STANDBY_BASE_URL:}
    #     api-key: ${RERANKER_STANDBY_API_KEY:}
    #     health-path: ${RERANKER_STANDBY_HEALTH_PATH:/v1/models}
    #     connect-timeout-millis: ${RERANKER_STANDBY_CONNECT_TIMEOUT_MILLIS:2000}
    #     read-timeout-millis: ${RERANKER_STANDBY_READ_TIMEOUT_MILLIS:5000}
    source-aware-ranking:
      enabled: ${RAG_SOURCE_AWARE_RANKING_ENABLED:true}
      rrf-normalization-factor: ${RAG_RRF_NORMALIZATION_FACTOR:31}
      dense-weight: ${RAG_DENSE_WEIGHT:0.55}
      rrf-weight: ${RAG_RRF_WEIGHT:0.45}
      plant-semantic-weight: ${RAG_PLANT_SEMANTIC_WEIGHT:0.70}
      plant-trust-weight: ${RAG_PLANT_TRUST_WEIGHT:0.20}
      plant-match-weight: ${RAG_PLANT_MATCH_WEIGHT:0.10}
      community-semantic-weight: ${RAG_COMMUNITY_SEMANTIC_WEIGHT:0.62}
      community-trust-weight: ${RAG_COMMUNITY_TRUST_WEIGHT:0.15}
      community-quality-weight: ${RAG_COMMUNITY_QUALITY_WEIGHT:0.13}
      community-recency-weight: ${RAG_COMMUNITY_RECENCY_WEIGHT:0.05}
      community-plant-match-weight: ${RAG_COMMUNITY_PLANT_MATCH_WEIGHT:0.05}
      community-essence-weight: ${RAG_COMMUNITY_ESSENCE_WEIGHT:0.20}
      community-engagement-weight: ${RAG_COMMUNITY_ENGAGEMENT_WEIGHT:0.80}
      collect-weight: ${RAG_COMMUNITY_COLLECT_WEIGHT:2.0}
      comment-weight: ${RAG_COMMUNITY_COMMENT_WEIGHT:1.5}
      view-weight: ${RAG_COMMUNITY_VIEW_WEIGHT:0.05}
      engagement-normalization: ${RAG_COMMUNITY_ENGAGEMENT_NORMALIZATION:1000}
      recency-decay-days: ${RAG_COMMUNITY_RECENCY_DECAY_DAYS:365}
    evidence-selector:
      enabled: ${RAG_EVIDENCE_SELECTOR_ENABLED:true}
      mixed-source-community-limit: ${RAG_MIXED_SOURCE_COMMUNITY_LIMIT:2}
    context-assembly:
      # 每条最终逻辑证据保留主片段与有限补充片段，避免 Prompt 被同一长文占满。
      max-fragments-per-logical-evidence: ${RAG_CONTEXT_ASSEMBLY_MAX_FRAGMENTS_PER_LOGICAL_EVIDENCE:2}
    # 不同 retrieval-mode / reranker 组合应分别用 Golden/Holdout 校准这些阈值。
    answerability:
      min-retrieval-relevance: ${RAG_ANSWERABILITY_MIN_RETRIEVAL_RELEVANCE:0.45}
      min-rerank-relevance: ${RAG_ANSWERABILITY_MIN_RERANK_RELEVANCE:0.40}
      min-aligned-semantic-relevance: ${RAG_ANSWERABILITY_MIN_ALIGNED_SEMANTIC_RELEVANCE:0.30}
      min-aligned-final-relevance: ${RAG_ANSWERABILITY_MIN_ALIGNED_FINAL_RELEVANCE:0.60}
      strong-recovery-relevance: ${RAG_ANSWERABILITY_STRONG_RECOVERY_RELEVANCE:0.60}
    plant-state:
      base-url: ${PLANT_STATE_BASE_URL:http://localhost:8070}
      api-key: ${PLANT_STATE_API_KEY:}
      connect-timeout-millis: ${PLANT_STATE_CONNECT_TIMEOUT_MILLIS:1000}
      read-timeout-millis: ${PLANT_STATE_READ_TIMEOUT_MILLIS:3000}
    attachments:
      ttl-seconds: ${RAG_ATTACHMENT_TTL_SECONDS:900}
      max-entries: ${RAG_ATTACHMENT_MAX_ENTRIES:32}
    disease-detector:
      base-url: ${DISEASE_DETECTOR_BASE_URL:http://localhost:5000}
      path: ${DISEASE_DETECTOR_PATH:/classify}
      connect-timeout-millis: ${DISEASE_DETECTOR_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${DISEASE_DETECTOR_READ_TIMEOUT_MILLIS:15000}
      max-image-bytes: ${DISEASE_DETECTOR_MAX_IMAGE_BYTES:10485760}
