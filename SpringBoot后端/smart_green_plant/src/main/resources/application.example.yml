server:
    port: 8070
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://<your-db-host>:3306/smart_agriculture?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8
    username: <your-db-username>
    password: <your-db-password>
  redis:
    host: localhost
    port: 6379
    password: <your-redis-password>
    database: 0
  mail:
    host: smtp.qq.com
    port: 465
    username: <your-email>  # QQ 邮箱
    password: <your-email-auth-code>  # QQ 邮箱的授权码
    protocol: smtp
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
# log
mybatis-plus:
    configuration:
        map-underscore-to-camel-case: true
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
        default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    global-config:
        db-config:
            logic-delete-field: deleted
            logic-delete-value: 1
            logic-not-delete-value: 0


weather:
    api:
        key: <your-weather-api-key>
        now:
            key: <your-weather-now-api-key>
# weather.api.base-url=https://  devapi.qweather.com/v7/weather/3d
iot:
    aliyun:
        accessKeyId: <your-aliyun-access-key-id>
        accessKeySecret: <your-aliyun-access-key-secret>
        consumerGroupId: <your-consumer-group-id>
        regionId: cn-shanghai
        iotInstanceId: <your-iot-instance-id>
        host: <your-iot-instance-id>.amqp.iothub.aliyuncs.com
        productKey: <your-product-key>
plant:
    jwt:
        # 设置jwt签名加密时使用的秘钥
        admin-secret-key: <your-admin-secret>
        # 设置jwt过期时间
        admin-ttl: 72000000
        # 设置前端传递过来的令牌名称
        admin-token-name: token
        user-secret-key: <your-user-secret>
        user-ttl: 72000000
        user-token-name: token

# 阿里镜像存储
smart:
    alioss:
        access-key-id: <your-oss-access-key-id>
        access-key-secret: <your-oss-access-key-secret>
        endpoint: oss-cn-hangzhou.aliyuncs.com
        bucket-name: <your-bucket-name>

# 百度
baidu:
  # 百度智能体
  api-key: <your-baidu-api-key>
  secret-key: <your-baidu-secret-key>
  multimodal-api-key: <your-baidu-multimodal-api-key>
  # 百度定位
  ak: <your-baidu-ak>
