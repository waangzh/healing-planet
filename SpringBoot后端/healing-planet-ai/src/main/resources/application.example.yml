server:
  port: ${AI_SERVER_PORT:8010}

spring:
  application:
    name: healing-planet-ai
  http:
    client:
      connect-timeout: ${AI_HTTP_CONNECT_TIMEOUT:10s}
      read-timeout: ${AI_HTTP_READ_TIMEOUT:60s}
    reactiveclient:
      connect-timeout: ${AI_HTTP_CONNECT_TIMEOUT:10s}
      read-timeout: ${AI_HTTP_REACTIVE_READ_TIMEOUT:120s}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${COMMUNITY_DB_URL:jdbc:mysql://localhost:3306/green_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${COMMUNITY_DB_USERNAME:root}
    password: ${COMMUNITY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      read-only: true
  ai:
    openai:
      api-key: ${LLM_API_KEY:change-me}
      base-url: ${LLM_BASE_URL:https://api.siliconflow.cn}
      chat:
        options:
          model: ${LLM_MODEL:Qwen/Qwen3.5-397B-A17B}
          temperature: 0.1
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        api-key: ${EMBEDDING_API_KEY:not-required}
        options:
          model: ${EMBEDDING_MODEL:BAAI/bge-m3}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  rag:
    dense-top-k: ${RAG_DENSE_TOP_K:30}
    sparse-top-k: ${RAG_SPARSE_TOP_K:30}
    final-top-k: ${RAG_FINAL_TOP_K:6}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.25}
    data-directory: ${RAG_DATA_DIRECTORY:data/rag}
    internal-api-key: ${RAG_INTERNAL_API_KEY:}
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_GRPC_PORT:6334}
      tls: ${QDRANT_TLS:false}
      api-key: ${QDRANT_API_KEY:}
      plant-collection: ${QDRANT_PLANT_COLLECTION:plant_knowledge}
      community-collection: ${QDRANT_COMMUNITY_COLLECTION:community_knowledge}
      disease-collection: ${QDRANT_DISEASE_COLLECTION:disease_knowledge}
      initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:true}
    reranker:
      enabled: ${RERANKER_ENABLED:true}
      base-url: ${RERANKER_BASE_URL:https://api.siliconflow.cn}
      path: ${RERANKER_PATH:/v1/rerank}
      api-key: ${RERANKER_API_KEY:}
      model: ${RERANKER_MODEL:BAAI/bge-reranker-v2-m3}
    plant-state:
      base-url: ${PLANT_STATE_BASE_URL:http://localhost:8070}
      api-key: ${PLANT_STATE_API_KEY:}
      connect-timeout-millis: ${PLANT_STATE_CONNECT_TIMEOUT_MILLIS:1000}
      read-timeout-millis: ${PLANT_STATE_READ_TIMEOUT_MILLIS:3000}
    attachments:
      ttl-seconds: ${RAG_ATTACHMENT_TTL_SECONDS:900}
      max-entries: ${RAG_ATTACHMENT_MAX_ENTRIES:32}
    disease-detector:
      base-url: ${DISEASE_DETECTOR_BASE_URL:http://localhost:5000}
      path: ${DISEASE_DETECTOR_PATH:/classify}
      connect-timeout-millis: ${DISEASE_DETECTOR_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${DISEASE_DETECTOR_READ_TIMEOUT_MILLIS:15000}
      max-image-bytes: ${DISEASE_DETECTOR_MAX_IMAGE_BYTES:10485760}
