server:
  port: 8000

web:
  domain: http://localhost

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: <your-db-username>
    password: <your-db-password>
    url: jdbc:mysql://<your-db-host>:3306/green_community?useUnicode=true&characterEncoding=utf8&autoReconnect=true&serverTimezone=GMT%2B8
    type: com.zaxxer.hikari.HikariDataSource
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: <your-rabbitmq-username>
    password: <your-rabbitmq-password>
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 8
    publisher-confirm-type: correlated
    publisher-returns: true
  redis:
    host: localhost
    port: 6379
    password: <your-redis-password>
    database: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  rag-admin:
    # 仅业务后端保存内部密钥；管理端浏览器永远不直连 AI 服务。
    ai-base-url: ${RAG_SERVICE_URL:http://localhost:8010}
    internal-api-key: ${RAG_INTERNAL_API_KEY:}
    connect-timeout-millis: ${RAG_ADMIN_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${RAG_ADMIN_READ_TIMEOUT_MILLIS:10000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 阿里镜像存储
smart:
  alioss:
    access-key-id: <your-oss-access-key-id>
    access-key-secret: <your-oss-access-key-secret>
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket-name: <your-bucket-name>

# 百度
baidu:
  # 百度智能体
  api-key: <your-baidu-api-key>
  secret-key: <your-baidu-secret-key>
  multimodal-api-key: <your-baidu-multimodal-api-key>

shared:
  back-end:
    url: http://localhost:8080/shared/

logging:
  level:
    root: info
    com.example.green: debug

# 拼图图片路径
file:
  img:
    url: ""
    path: "<your-img-path>"
